services:
  - type: web
    name: atelier-armario-free
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm run render:free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANALYSIS_MODEL
        value: gpt-4.1-mini
      - key: IMAGE_MODEL
        value: gpt-image-2
